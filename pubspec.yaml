name: minivo
description: "Minivo - Your Pocket Arcade. Play 100+ free mini games — puzzles, arcade, board & more!"
publish_to: 'none'
version: 1.10.0+24

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flame: ^1.22.0
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.0+3
  uuid: ^4.5.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  firebase_core: ^4.7.0
  firebase_analytics: ^12.3.0
  firebase_crashlytics: ^5.2.0
  firebase_remote_config: ^6.1.0
  google_mobile_ads: ^7.0.0
  package_info_plus: ^8.3.0
  share_plus: ^11.0.0
  path_provider: ^2.1.5
  in_app_review: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/games/tic_tac_toe/
    - google_fonts/
